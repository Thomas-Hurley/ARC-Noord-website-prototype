<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proefles aanvragen | ARC Noord Nederland</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="../js/dropdown.js"></script>
</head>

<body class="bg-white text-gray-800">

    <header class="bg-gray-900 text-white">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="text-xl font-bold">ARC Noord Nederland</span>

            <nav class="hidden md:flex gap-8 text-sm font-semibold">
                <a href="../index.html" class="hover:text-pink-400">Home</a>
                <a href="informatie.html" class="hover:text-pink-400">Informatie</a>
                <a href="rooster.html" class="hover:text-pink-400">Trainers</a>
                <a href="formulier.html" class="text-pink-400">Inschrijven</a>
                <a href="clubnieuws.html" class="hover:text-pink-400">Clubnieuws</a>
                <a href="foto's.html" class="hover:text-pink-400">Foto's</a>
                <a href="contact.html" class="hover:text-pink-400">Contact</a>
            </nav>

            <button id="menu-btn" class="md:hidden text-2xl">☰</button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden flex flex-col bg-gray-800 text-start py-4 pl-6 space-y-4">
            <a href="../index.html" class="hover:text-pink-400">Home</a>
            <a href="informatie.html" class="hover:text-pink-400">Informatie</a>
            <a href="rooster.html" class="hover:text-pink-400">Trainers</a>
            <a href="formulier.html" class="text-pink-400">Inschrijven</a>
            <a href="clubnieuws.html" class="hover:text-pink-400">Clubnieuws</a>
            <a href="foto's.html" class="hover:text-pink-400">Foto's</a>
            <a href="contact.html" class="hover:text-pink-400">Contact</a>
        </div>
    </header>

    <section class="bg-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-16 text-center">
            <h1 class="text-3xl md:text-4xl font-bold mb-4">
                Schrijf je in!
            </h1>
            <p class="max-w-2xl mx-auto text-gray-600">
                Vul het formulier hieronder in en wij nemen zo snel mogelijk contact met je op.
            </p>
        </div>
    </section>

    <section class="max-w-3xl mx-auto px-6 py-16">
        <form class="bg-gray-100 p-8 md:p-10 rounded-2xl shadow space-y-6">

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2">Voornaam</label>
                    <input type="text"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Achternaam</label>
                    <input type="text"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                        required />
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Geboortedatum</label>
                <input type="date"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                    required />
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Adres</label>
                <input type="text"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                    required />
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold mb-2">Postcode</label>
                    <input type="text"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                        required />
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Woonplaats</label>
                    <input type="text"
                        class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                        required />
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Telefoonnummer</label>
                <input type="tel"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                    required />
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">E-mailadres</label>
                <input type="email"
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500"
                    required />
            </div>

            <div class="pt-4 text-center">
                <button type="submit"
                    class="bg-pink-500 hover:bg-pink-600 transition text-white font-semibold px-10 py-4 rounded-xl shadow-lg">
                    Versturen
                </button>
            </div>

        </form>
    </section>

    <footer class="bg-gray-900 text-gray-300">
        <div class="max-w-7xl mx-auto px-6 py-8 text-center text-sm">
            © 2026 ARC Noord Nederland · Alle rechten voorbehouden
        </div>
    </footer>

</body>

</html>
